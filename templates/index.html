<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVHS Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .chat-container { width: 420px; height: 600px; background: white; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); display: flex; flex-direction: column; overflow: hidden; }
    .chat-header { background: #1a4fa0; color: white; padding: 18px 20px; font-size: 17px; font-weight: 600; }
    .chat-header span { font-size: 13px; font-weight: 400; opacity: 0.8; display: block; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; }
    .user { background: #1a4fa0; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .bot { background: #f0f4f8; color: #222; align-self: flex-start; border-bottom-left-radius: 4px; }
    .chat-input { display: flex; padding: 12px; border-top: 1px solid #eee; gap: 8px; }
    .chat-input input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 24px; font-size: 14px; outline: none; }
    .chat-input input:focus { border-color: #1a4fa0; }
    .chat-input button { background: #1a4fa0; color: white; border: none; padding: 10px 18px; border-radius: 24px; font-size: 14px; cursor: pointer; }
    .chat-input button:hover { background: #163d80; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      🐾 AVHS Assistant
      <span>Amador Valley High School</span>
    </div>
    <div class="chat-messages" id="messages">
      <div class="message bot">Hi! I'm the AVHS Assistant. Ask me anything about Amador Valley High School — bell schedules, clubs, attendance, and more!</div>
    </div>
    <div class="chat-input">
      <input type="text" id="input" placeholder="Ask a question..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    let history = [];

    async function sendMessage() {
      const input = document.getElementById("input");
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";
      history.push({ role: "user", content: text });

      const typing = addMessage("Typing...", "bot");

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ history })
        });
        const data = await res.json();

        typing.remove();
        addMessage(data.reply, "bot");
        history.push({ role: "assistant", content: data.reply });
      } catch (error) {
        typing.remove();
        addMessage("Sorry, something went wrong. Please try again.", "bot");
      }
    }

    function addMessage(text, className) {
      const div = document.createElement("div");
      div.className = `message ${className}`;
      div.textContent = text;
      const messages = document.getElementById("messages");
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    document.getElementById("input").addEventListener("keydown", event => {
      if (event.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
